<section class="auth-card">
  <div class="auth-brand">
    <span class="logo-mark">WP</span>
    <h1>Welcome back</h1>
    <p>Sign in to your WorkPulse workspace</p>
  </div>

  @if (error()) {
    <div class="alert alert-error" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="you@company.com" />
    </label>

    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="auth-footer">
    New here?
    <a routerLink="/auth/register">Create an account</a>
  </p>
</section>
