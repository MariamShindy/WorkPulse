<section class="auth-card">
  <div class="auth-brand">
    <span class="logo-mark" aria-hidden="true">WP</span>
    <h1>Welcome back</h1>
    <p>Sign in to your WorkPulse workspace</p>
  </div>

  @if (error()) {
    <div class="alert alert-error" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@company.com"
        [class.invalid]="form.controls.email.touched && form.controls.email.invalid" />
      @if (form.controls.email.touched && form.controls.email.errors?.['required']) {
        <span class="field-error">Email is required.</span>
      } @else if (form.controls.email.touched && form.controls.email.errors?.['email']) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label>
      <span>Password</span>
      <div class="input-group">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [class.invalid]="form.controls.password.touched && form.controls.password.invalid" />
        <button
          type="button"
          class="input-suffix-btn"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          {{ showPassword() ? '🙈' : '👁' }}
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
        <span class="field-error">Password is required.</span>
      }
    </label>

    <button type="submit" class="btn btn-primary btn-lg" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="auth-footer">
    New here?
    <a routerLink="/auth/register">Create an account</a>
  </p>
</section>
