<section class="auth-card">
  <div class="auth-brand">
    <span class="logo-mark">WP</span>
    <h1>Create account</h1>
    <p>Start managing projects with your team</p>
  </div>

  @if (error()) {
    <div class="alert alert-error" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="name-row">
      <label>
        <span>First name</span>
        <input type="text" formControlName="firstName" autocomplete="given-name" />
      </label>
      <label>
        <span>Last name</span>
        <input type="text" formControlName="lastName" autocomplete="family-name" />
      </label>
    </div>

    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" placeholder="Min. 8 characters" />
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <p class="auth-footer">
    Already have an account?
    <a routerLink="/auth/login">Sign in</a>
  </p>
</section>
