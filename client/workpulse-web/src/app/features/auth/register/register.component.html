<button
  type="button"
  class="btn btn-ghost btn-icon theme-toggle"
  (click)="toggleTheme()"
  [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
  [attr.title]="theme.isDark() ? 'Light mode' : 'Dark mode'">
  @if (theme.isDark()) {
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  } @else {
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
  }
</button>

<section class="auth-card">
  <div class="auth-brand">
    <span class="logo-mark" aria-hidden="true">WP</span>
    <h1>Create account</h1>
    <p>Start managing projects with your team</p>
  </div>

  @if (error()) {
    <div class="alert alert-error" role="alert" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="name-row">
      <label>
        <span>First name</span>
        <input
          type="text"
          formControlName="firstName"
          autocomplete="given-name"
          [class.invalid]="form.controls.firstName.touched && form.controls.firstName.invalid" />
        @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
          <span class="field-error">First name is required.</span>
        }
      </label>
      <label>
        <span>Last name</span>
        <input
          type="text"
          formControlName="lastName"
          autocomplete="family-name"
          [class.invalid]="form.controls.lastName.touched && form.controls.lastName.invalid" />
        @if (form.controls.lastName.touched && form.controls.lastName.invalid) {
          <span class="field-error">Last name is required.</span>
        }
      </label>
    </div>

    <label>
      <span>Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@company.com"
        [class.invalid]="form.controls.email.touched && form.controls.email.invalid" />
      @if (form.controls.email.touched && form.controls.email.errors?.['required']) {
        <span class="field-error">Email is required.</span>
      } @else if (form.controls.email.touched && form.controls.email.errors?.['email']) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label>
      <span>Password</span>
      <div class="input-group">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Min. 8 characters"
          [class.invalid]="form.controls.password.touched && form.controls.password.invalid" />
        <button
          type="button"
          class="input-suffix-btn"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 3l18 18M10.5 10.6a2.5 2.5 0 0 0 3 3M9.9 5.2A10.5 10.5 0 0 1 12 5c5 0 9 4 10.5 7-0.6 1.2-1.5 2.5-2.7 3.6M6.1 6.2C4.6 7.4 3.5 8.9 2.5 12 4 15 8 19 12 19c1.2 0 2.4-.2 3.5-.6"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2.5 12C4 9 8 5 12 5s8 4 9.5 7C20 15 16 19 12 19S4 15 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
        <span class="field-error">Password is required.</span>
      } @else if (form.controls.password.touched && form.controls.password.errors?.['minlength']) {
        <span class="field-error">Password must be at least 8 characters.</span>
      }
    </label>

    <button type="submit" class="btn btn-primary btn-lg" [class.is-busy]="loading()" [disabled]="loading()">
      {{ loading() ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <p class="auth-footer">
    Already have an account?
    <a routerLink="/auth/login">Sign in</a>
  </p>
</section>
