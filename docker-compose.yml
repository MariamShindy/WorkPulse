name: workpulse

services:
  postgres:
    image: postgres:17-alpine
    container_name: workpulse-postgres
    environment:
      POSTGRES_DB: workpulse
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workpulse-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/WorkPulse.API/Dockerfile
    container_name: workpulse-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=workpulse;Username=workpulse;Password=workpulse
      ConnectionStrings__Redis: redis:6379
      # Ollama runs on the host — localhost inside the container is wrong.
      AiChat__Enabled: "true"
      AiChat__BaseUrl: http://host.docker.internal:11434
      AiChat__Model: llama3.1
      AiChat__TimeoutSeconds: "120"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
