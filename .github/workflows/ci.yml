name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workpulse
          POSTGRES_USER: workpulse
          POSTGRES_PASSWORD: workpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=workpulse;Username=workpulse;Password=workpulse
      ConnectionStrings__Redis: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WorkPulse.slnx

      - name: Build
        run: dotnet build WorkPulse.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WorkPulse.slnx --configuration Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/workpulse-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/workpulse-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build
