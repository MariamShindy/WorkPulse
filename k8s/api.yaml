apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: workpulse
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30808
  selector:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: workpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workpulse
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workpulse
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: workpulse
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U workpulse -d workpulse; do echo waiting for postgres; sleep 2; done
        - name: wait-for-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until redis-cli -h redis ping; do echo waiting for redis; sleep 2; done
      containers:
        - name: api
          image: workpulse-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: workpulse-config
            - secretRef:
                name: workpulse-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
