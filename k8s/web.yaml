apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: workpulse
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
  selector:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: workpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workpulse
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workpulse
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: workpulse
    spec:
      containers:
        - name: web
          image: workpulse-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
