# Local-dev secrets that match docker-compose. Change these before any shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: workpulse-secrets
  labels:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/part-of: workpulse
type: Opaque
stringData:
  POSTGRES_USER: workpulse
  POSTGRES_PASSWORD: workpulse
  POSTGRES_DB: workpulse
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=workpulse;Username=workpulse;Password=workpulse
  ConnectionStrings__Redis: redis:6379
  JwtSettings__SecretKey: CHANGE_ME_K8S_LOCAL_SECRET_KEY_MIN_32_CHARS!!
